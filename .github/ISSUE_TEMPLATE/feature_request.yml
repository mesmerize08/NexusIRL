name: Feature request
description: Something Moblin does that NexusIRL should, or a new idea.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it while streaming?
  - type: input
    id: moblin
    attributes:
      label: Does Moblin (iOS) have it? Where in Moblin's settings?
