name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing NexusIRL. **Never paste stream keys, stream URLs with keys, tokens or
        passwords** into an issue. Security problems go to the Security tab ("Report a
        vulnerability"), not here.
  - type: input
    id: version
    attributes:
      label: App version
      description: From the release you installed, e.g. v0.1.0.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: e.g. Samsung Galaxy S26 Ultra, Android 17
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Streaming protocol
      options: [SRT, SRTLA (bonding), RTMP, RTMPS, Not streaming]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Resolution and frame rate, codec, network (Wi-Fi, mobile data, both), how long it ran, screenshots.
