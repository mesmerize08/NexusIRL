name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Independence check
        run: sh tools/check-independence.sh
      - name: Style, unit tests, lint, licence check and debug build
        run: |
          set -o pipefail
          ./gradlew ktlintCheck test lint :app:licensee assembleDebug --console=plain 2>&1 | tee gradle-build.log
      - name: Summarise the Gradle failure
        if: failure()
        # Annotations are visible without signing in, unlike job logs.
        run: |
          summary=$(grep -A40 -E "What went wrong|Dependency verification failed" gradle-build.log | head -60 || true)
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\n'/'%0A'}"
          echo "::error title=Gradle failure::${summary}"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build
        run: ./gradlew assembleDebug --console=plain
      - uses: github/codeql-action/analyze@v3

  ui-tests:
    # The app's UI smoke tests (app/src/androidTest) on an Android 14 emulator without cameras:
    # every screen opens, and a stream added through the UI never shows its key.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI smoke tests on an emulator
        # Third-party action, pinned to the commit of v2.38.0.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Upload UI test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/
