name: Release

# Builds signed APKs (arm64-v8a and universal) when a version tag (v*) is pushed and attaches it, with its SHA-256,
# to a GitHub Release. See docs/RELEASING.md for the signing secrets.
on:
  push:
    tags: ["v*"]
  # Manual dry run: builds and signs, uploads the APK as a workflow artifact, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Independence check
        run: sh tools/check-independence.sh
      - name: Tests and lint
        run: ./gradlew ktlintCheck test lint :app:licensee --console=plain
      - name: Signed release build
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUSIRL_KEYSTORE_BASE64 }}
          NEXUSIRL_KEYSTORE_PASSWORD: ${{ secrets.NEXUSIRL_KEYSTORE_PASSWORD }}
          NEXUSIRL_KEY_ALIAS: ${{ secrets.NEXUSIRL_KEY_ALIAS }}
          NEXUSIRL_KEY_PASSWORD: ${{ secrets.NEXUSIRL_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "NEXUSIRL_KEYSTORE_BASE64 secret is not set"; exit 1; }
          export NEXUSIRL_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$NEXUSIRL_KEYSTORE"
          ./gradlew assembleRelease --console=plain
          rm -f "$NEXUSIRL_KEYSTORE"
      - name: Package
        run: |
          mkdir dist
          out=app/build/outputs/apk/release
          cp "$out/app-arm64-v8a-release.apk" "dist/NexusIRL-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp "$out/app-universal-release.apk" "dist/NexusIRL-${GITHUB_REF_NAME}-universal.apk"
          cd dist && sha256sum *.apk > SHA256SUMS
      - name: Show the signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do "$apksigner" verify --verbose --print-certs "$apk"; done | tee certs.txt
          cert=$(grep -E "certificate (DN|SHA-256 digest)" certs.txt | sort -u)
          echo "::notice title=Signing certificate::${cert//$'\n'/'%0A'}"
      - name: Upload dry-run APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: nexusirl-dry-run
          path: dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes for testers when they exist, otherwise GitHub's commit summary.
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "NexusIRL $GITHUB_REF_NAME" --notes-file "$notes" --prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "NexusIRL $GITHUB_REF_NAME" --generate-notes --prerelease
          fi
