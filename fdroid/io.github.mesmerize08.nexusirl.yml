AutoName: NexusIRL

RepoType: git
Repo: https://github.com/mesmerize08/NexusIRL.git

Builds:
  - versionName: 0.4.0
    versionCode: 6
    commit: v0.4.0
    subdir: app
    gradle:
      - yes
    gradleprops:
      - noAbiSplits

AutoUpdateMode: Version
UpdateCheckMode: Tags
