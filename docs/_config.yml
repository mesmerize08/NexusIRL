# GitHub Pages site for the docs folder: https://mesmerize08.github.io/NexusIRL/
# Own layout (docs/_layouts/default.html) and stylesheet (docs/assets/css/site.css); no theme.
title: NexusIRL
description: >-
  NexusIRL is a free, open-source IRL live streaming app for Android: SRTLA bonding of mobile data
  and Wi-Fi, adaptive bitrate, SRT and RTMP, Twitch and Kick chat, OBS remote control. An Android
  port of Moblin.
url: https://mesmerize08.github.io
baseurl: /NexusIRL
lang: en
repository: mesmerize08/NexusIRL
repository_url: https://github.com/mesmerize08/NexusIRL
# Used when GitHub's release list is unavailable at build time; update with each release.
fallback_release: v0.5.1
logo: /assets/img/icon-192.png
# All are on GitHub Pages' allowed plugin list: page meta tags, a sitemap, release information.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
defaults:
  - scope:
      path: ""
    values:
      layout: default
      # The link preview image (jekyll-seo-tag reads it per page; it also makes a large Twitter card).
      image: /assets/img/social-card.png
